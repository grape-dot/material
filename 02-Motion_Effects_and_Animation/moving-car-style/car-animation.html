<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小车奔跑动画</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #0e1726;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { width: min(96vw, 1100px); }
  .stage {
    position: relative; border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45); background: #1598fc;
  }
  svg.scene { display: block; width: 100%; height: auto; }

  /* 小车颠簸 */
  .bounce { animation: bounce calc(.5s * var(--speed,1)) ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* 车轮旋转 */
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin calc(.6s * var(--speed,1)) linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* robot 小旗飘动 */
  .flag { transform-box: fill-box; transform-origin: left center; animation: wave calc(.95s * var(--speed,1)) ease-in-out infinite alternate; }
  @keyframes wave { from { transform: skewX(7deg) scaleX(1); } to { transform: skewX(-13deg) scaleX(.9); } }

  /* 车后灰尘 */
  .dust { transform-box: fill-box; transform-origin: center; opacity: 0; animation: dust calc(1.15s * var(--speed,1)) ease-out infinite; }
  @keyframes dust { 0% { opacity:.5; transform: translate(0,0) scale(.4); } 100% { opacity:0; transform: translate(-32px,-14px) scale(1.6); } }

  /* 杂草摇摆（绕根部） */
  .grass { transform-box: fill-box; transform-origin: bottom center; animation: sway calc(2.4s * var(--speed,1)) ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }

  /* 淡云缓缓飘（被风吹） */
  .cloud { animation: drift calc(13s * var(--speed,1)) ease-in-out infinite alternate; }
  .cloud.c2 { animation-duration: calc(18s * var(--speed,1)); }
  @keyframes drift { from { transform: translateX(-22px) scale(1); } to { transform: translateX(26px) scale(1.03); } }

  /* 地面无缝左滚 → 小车前进视差 */
  .terrain  { animation: scroll calc(6.5s * var(--speed,1)) linear infinite; }
  .backhill { animation: scroll calc(14s * var(--speed,1)) linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1289px); } }

  svg.scene.paused * { animation-play-state: paused !important; }

  .controls { margin-top: 14px; display: flex; align-items: center; gap: 16px; color: #cdd6e4; font-size: 14px; }
  .controls button { background: #2b3a55; color: #eaf1ff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; transition: background .2s; }
  .controls button:hover { background: #3a4d70; }
  .controls input[type=range] { width: 160px; accent-color: #5aa9ff; }
  .controls label { white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg class="scene" viewBox="0 0 1289 432" xmlns="http://www.w3.org/2000/svg" style="--speed:1">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0e96fc"/>
          <stop offset="1" stop-color="#5cb8fb"/>
        </linearGradient>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#163d22"/>
          <stop offset="1" stop-color="#0c2014"/>
        </linearGradient>
        <!-- 一丛细草（根部 0,0，向上生长） -->
        <g id="blades">
          <path d="M0,0 Q-3,-14 -6,-24" stroke="#2f7d3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M0,0 Q-1,-16 0,-28"  stroke="#37933f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M0,0 Q4,-13 8,-22"   stroke="#2f7d3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M0,0 Q-7,-9 -10,-14" stroke="#256b2e" stroke-width="2"   fill="none" stroke-linecap="round"/>
          <path d="M0,0 Q7,-9 11,-13"   stroke="#256b2e" stroke-width="2"   fill="none" stroke-linecap="round"/>
        </g>
      </defs>

      <!-- 天空 -->
      <rect x="0" y="0" width="1289" height="432" fill="url(#sky)"/>

      <!-- 淡云（原图云很淡，几乎融进天空） -->
      <g class="cloud c1" fill="#ffffff" opacity=".5">
        <g transform="translate(657,150)">
          <ellipse cx="0" cy="0" rx="46" ry="22"/>
          <ellipse cx="40" cy="6" rx="34" ry="18"/>
          <ellipse cx="-34" cy="8" rx="30" ry="16"/>
        </g>
      </g>
      <g class="cloud c2" fill="#ffffff" opacity=".42">
        <g transform="translate(270,232)">
          <ellipse cx="0" cy="0" rx="38" ry="17"/>
          <ellipse cx="30" cy="5" rx="26" ry="14"/>
          <ellipse cx="-26" cy="6" rx="22" ry="12"/>
        </g>
      </g>

      <!-- 远山（淡绿，慢滚） -->
      <g class="backhill">
        <g>
          <path d="M0,226 C200,206 400,226 600,213 C820,199 1040,223 1289,211 L1289,432 L0,432 Z"
                fill="#1d4a2b" opacity=".45"/>
        </g>
        <g transform="translate(1289,0)">
          <path d="M0,226 C200,206 400,226 600,213 C820,199 1040,223 1289,211 L1289,432 L0,432 Z"
                fill="#1d4a2b" opacity=".45"/>
        </g>
      </g>

      <!-- 主地形（深墨绿，无缝滚动 + 草摇 + 白岩） -->
      <g class="terrain">
        <g>
          <path d="M0,246 C160,226 320,251 480,239 C640,227 800,253 960,241 C1120,229 1240,251 1289,243 L1289,432 L0,432 Z"
                fill="url(#hill)"/>
          <!-- 白色岩石（右下） -->
          <g fill="#eef3f5" stroke="#cdd8dc" stroke-width="2">
            <ellipse cx="955" cy="252" rx="40" ry="21"/>
            <ellipse cx="918" cy="258" rx="22" ry="13"/>
          </g>
          <!-- 杂草丛（沿丘顶） -->
          <g transform="translate(120,240)"><g class="grass" style="animation-delay:-.2s"><use href="#blades"/></g></g>
          <g transform="translate(300,236)"><g class="grass" style="animation-delay:-1.0s"><use href="#blades"/></g></g>
          <g transform="translate(520,244)"><g class="grass" style="animation-delay:-.6s"><use href="#blades"/></g></g>
          <g transform="translate(690,238)"><g class="grass" style="animation-delay:-1.5s"><use href="#blades"/></g></g>
          <g transform="translate(820,246)"><g class="grass" style="animation-delay:-.9s"><use href="#blades"/></g></g>
          <g transform="translate(1060,240)"><g class="grass" style="animation-delay:-1.3s"><use href="#blades"/></g></g>
          <g transform="translate(1180,236)"><g class="grass" style="animation-delay:-.4s"><use href="#blades"/></g></g>
        </g>
        <g transform="translate(1289,0)">
          <path d="M0,246 C160,226 320,251 480,239 C640,227 800,253 960,241 C1120,229 1240,251 1289,243 L1289,432 L0,432 Z"
                fill="url(#hill)"/>
          <g fill="#eef3f5" stroke="#cdd8dc" stroke-width="2">
            <ellipse cx="955" cy="252" rx="40" ry="21"/>
            <ellipse cx="918" cy="258" rx="22" ry="13"/>
          </g>
          <g transform="translate(120,240)"><g class="grass" style="animation-delay:-.2s"><use href="#blades"/></g></g>
          <g transform="translate(300,236)"><g class="grass" style="animation-delay:-1.0s"><use href="#blades"/></g></g>
          <g transform="translate(520,244)"><g class="grass" style="animation-delay:-.6s"><use href="#blades"/></g></g>
          <g transform="translate(690,238)"><g class="grass" style="animation-delay:-1.5s"><use href="#blades"/></g></g>
          <g transform="translate(820,246)"><g class="grass" style="animation-delay:-.9s"><use href="#blades"/></g></g>
          <g transform="translate(1060,240)"><g class="grass" style="animation-delay:-1.3s"><use href="#blades"/></g></g>
          <g transform="translate(1180,236)"><g class="grass" style="animation-delay:-.4s"><use href="#blades"/></g></g>
        </g>
      </g>

      <!-- 小车（白车身 + 黑轮 + robot 红旗，颠簸跑动） -->
      <g transform="translate(387,158)">
        <g class="bounce">
          <!-- 地面投影 -->
          <ellipse cx="88" cy="92" rx="92" ry="9" fill="#0a1c10" opacity=".35"/>

          <!-- 车身 -->
          <rect x="0" y="32" width="176" height="38" rx="16" fill="#f4f7f9" stroke="#c2ccd1" stroke-width="2"/>
          <!-- 座舱 / 风挡 -->
          <path d="M44,32 Q56,12 92,15 Q120,17 130,32 Z" fill="#bfe3fb" stroke="#c2ccd1" stroke-width="2"/>
          <!-- 车头灯 -->
          <circle cx="170" cy="56" r="5" fill="#ffd54f"/>

          <!-- 旗杆 + robot 小旗 -->
          <line x1="150" y1="32" x2="150" y2="2" stroke="#6d4c41" stroke-width="3" stroke-linecap="round"/>
          <g class="flag">
            <path d="M150,3 L188,8 L150,16 Z" fill="#e23b3b"/>
            <text x="154" y="12" font-size="9" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">ROBOT</text>
          </g>

          <!-- 车后灰尘 -->
          <circle class="dust" cx="-2" cy="86" r="7" fill="#c9d3d8" style="animation-delay:0s"/>
          <circle class="dust" cx="3"  cy="90" r="6" fill="#aeb9bf" style="animation-delay:.4s"/>
          <circle class="dust" cx="-4" cy="88" r="5" fill="#c9d3d8" style="animation-delay:.75s"/>

          <!-- 后轮 -->
          <g transform="translate(45,72)">
            <g class="wheel">
              <circle r="17" fill="#1a1a1a"/>
              <circle r="7" fill="#8a8f93"/>
              <g stroke="#8a8f93" stroke-width="2.4">
                <line x1="0" y1="-7" x2="0" y2="7"/>
                <line x1="-7" y1="0" x2="7" y2="0"/>
                <line x1="-5" y1="-5" x2="5" y2="5"/>
                <line x1="-5" y1="5" x2="5" y2="-5"/>
              </g>
            </g>
          </g>
          <!-- 前轮 -->
          <g transform="translate(130,72)">
            <g class="wheel">
              <circle r="17" fill="#1a1a1a"/>
              <circle r="7" fill="#8a8f93"/>
              <g stroke="#8a8f93" stroke-width="2.4">
                <line x1="0" y1="-7" x2="0" y2="7"/>
                <line x1="-7" y1="0" x2="7" y2="0"/>
                <line x1="-5" y1="-5" x2="5" y2="5"/>
                <line x1="-5" y1="5" x2="5" y2="-5"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <div class="controls">
    <button id="toggle">⏸ 暂停</button>
    <label>速度</label>
    <input id="speed" type="range" min="0.3" max="2" step="0.1" value="1">
    <span id="speedVal">1.0×</span>
  </div>
</div>

<script>
  const svg = document.querySelector('svg.scene');
  const btn = document.getElementById('toggle');
  const speed = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  btn.addEventListener('click', () => {
    svg.classList.toggle('paused');
    btn.textContent = svg.classList.contains('paused') ? '▶ 播放' : '⏸ 暂停';
  });
  speed.addEventListener('input', () => {
    const v = parseFloat(speed.value);
    svg.style.setProperty('--speed', v);
    speedVal.textContent = v.toFixed(1) + '×';
  });
</script>
</body>
</html>
