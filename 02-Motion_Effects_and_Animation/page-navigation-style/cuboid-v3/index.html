<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airbag Studio — Page-turn flip (v3)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Airbag Studio design tokens (extracted from the live site) */
      --purple: #b91b4c;
      --purple-dark: #841a3b;
      --beige: #eeece7;
      --black: #0c0a0b;
      --white: #ffffff;
      --orange: #ff6620;
      --orange-dark: #cc4f00;

      --radius: 5rem;
      --face-h: clamp(420px, 68vh, 620px);

      --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--beige);
      color: var(--black);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, p { margin: 0; }

    .page { position: relative; }

    .spacer {
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 6vw;
    }
    .spacer__hint {
      font-size: clamp(18px, 2.4vw, 30px);
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 0.55;
      max-width: 28ch;
    }
    .spacer__tag {
      display: inline-block;
      margin-bottom: 14px;
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--purple);
      font-weight: 700;
    }

    /* ---------- cuboid section ---------- */
    .cuboid-section { position: relative; }

    /* pinned viewport */
    .cuboid-viewport {
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1500px;
      perspective-origin: 50% 50%;
      overflow: hidden;
      transition: background-color 0.6s ease;
    }

    /* rotating 3D stage */
    .cuboid-stage {
      position: relative;
      width: min(1160px, 90vw);
      height: var(--face-h);
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* one face — pre-JS default matches p=0: first face front, the rest hidden below */
    .cuboid-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      border-radius: clamp(1.5rem, 3.4vw, 3rem);
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      transform: rotateX(90deg);
      transform-origin: 50% 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
    }
    .cuboid-face:first-child {
      transform: rotateX(0deg);
      transform-origin: 50% 0%;
    }

    .cuboid-face__inner {
      position: relative;
      width: 100%;
      padding: clamp(28px, 5vw, 72px);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: clamp(20px, 4vw, 56px);
      will-change: transform, opacity;
    }

    .cuboid-face__index {
      font-size: clamp(13px, 1.2vw, 16px);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.65;
      margin-bottom: clamp(14px, 2vw, 26px);
    }

    .cuboid-face__title {
      font-size: clamp(34px, 5.2vw, 74px);
      line-height: 1.02;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .cuboid-face__body {
      margin-top: clamp(16px, 2.2vw, 28px);
      font-size: clamp(16px, 1.6vw, 22px);
      line-height: 1.4;
      font-weight: 400;
      max-width: 34ch;
      opacity: 0.92;
    }

    /* decorative diamond mark (echoes the original SVG line-art) */
    .cuboid-face__mark {
      width: clamp(90px, 13vw, 190px);
      height: auto;
      flex-shrink: 0;
    }

    /* ---------- progress dots ---------- */
    .cuboid-progress {
      position: absolute;
      right: clamp(18px, 4vw, 56px);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 5;
    }
    .cuboid-progress__dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.28;
      transform: scale(1);
      transition: transform 0.35s cubic-bezier(0.215, 0.61, 0.355, 1), opacity 0.35s;
    }
    .cuboid-progress__dot.is-active {
      opacity: 1;
      transform: scale(1.5);
    }

    /* ---------- mobile / touch fallback (stacked) ---------- */
    .cuboid-stack { display: none; }

    @media (max-width: 1023px), (hover: none), (pointer: coarse) {
      .cuboid-viewport { display: none; }
      .cuboid-stack {
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 12vh 5vw;
      }
      .cuboid-stack .cuboid-face {
        position: relative;
        inset: auto;
        height: auto;
        min-height: 320px;
        /* fix: cancel the rotateX(90deg) inherited from the base rule,
           otherwise cards are edge-on / invisible when JS does not run */
        transform: none;
        backface-visibility: visible;
        -webkit-backface-visibility: visible;
      }
      .cuboid-progress { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="spacer">
      <div>
        <span class="spacer__tag">Version 3 · Page-turn</span>
        <p class="spacer__hint">
          Scroll down — each page flips up while the next turns in from below.
        </p>
      </div>
    </section>

    <section class="cuboid-section">
      <!-- desktop: pinned page-turn stage -->
      <div class="cuboid-viewport" id="viewport">
        <div class="cuboid-stage" id="stage"></div>

        <div class="cuboid-progress" id="progress" aria-hidden="true"></div>
      </div>

      <!-- mobile / touch: stacked static cards -->
      <div class="cuboid-stack" id="stack"></div>
    </section>

    <section class="spacer">
      <p class="spacer__hint">End of the sequence. Scroll back up to replay.</p>
    </section>
  </main>

  <script src="./gsap.min.js"></script>
  <script src="./ScrollTrigger.min.js"></script>
  <script>
    const FACES = [
      {
        index: "01",
        title: "We don't worry about change",
        body: "We are the ideal partner for creating unique digital solutions, together.",
        bg: "#b91b4c",
        text: "#ffffff",
        accent: "#841a3b",
      },
      {
        index: "02",
        title: "Our route into the future",
        body: "We shape new products by combining design, technology and creativity.",
        bg: "#eeece7",
        text: "#0c0a0b",
        accent: "#b91b4c",
      },
      {
        index: "03",
        title: "Design meets technology",
        body: "Useful, simple, ergonomic interfaces built around real user needs.",
        bg: "#0c0a0b",
        text: "#ffffff",
        accent: "#ff6620",
      },
      {
        index: "04",
        title: "Built to move forward",
        body: "We prototype fast, iterate with data and ship products that scale.",
        bg: "#ff6620",
        text: "#ffffff",
        accent: "#841a3b",
      },
    ];

    const clamp01 = (v) => Math.max(0, Math.min(1, v));

    // ---- build DOM (same markup for desktop + mobile) ----
    const MARK_SVG = `
      <svg class="cuboid-face__mark" viewBox="0 0 321 358" fill="none" aria-hidden="true">
        <path d="M3.53043 91.658L198.442 3.30924L317.979 267.027L307.921 309.431L122.566 354.269L3.53043 91.658Z" stroke="COLOR" stroke-width="5"/>
        <path d="M197 3L46 107L1 91.5" stroke="COLOR" stroke-width="5"/>
      </svg>`;

    function faceHTML(f, withMark) {
      return `
        <div class="cuboid-face" style="background-color:${f.bg};color:${f.text}">
          <div class="cuboid-face__inner">
            <div>
              <p class="cuboid-face__index">${f.index} — Mission</p>
              <h2 class="cuboid-face__title" style="color:${f.accent}">${f.title}</h2>
              <p class="cuboid-face__body">${f.body}</p>
            </div>
            ${withMark ? MARK_SVG.replace(/COLOR/g, f.accent) : ""}
          </div>
        </div>`;
    }

    const stage = document.getElementById("stage");
    const stack = document.getElementById("stack");
    const progress = document.getElementById("progress");
    const viewport = document.getElementById("viewport");

    stage.innerHTML = FACES.map((f) => faceHTML(f, true)).join("");
    stack.innerHTML = FACES.map((f) => faceHTML(f, false)).join("");
    progress.innerHTML = FACES.map(
      (f, i) => `<span class="cuboid-progress__dot${i === 0 ? " is-active" : ""}"></span>`
    ).join("");

    const faces = Array.from(stage.querySelectorAll(".cuboid-face"));
    const inners = Array.from(stage.querySelectorAll(".cuboid-face__inner"));
    const dots = Array.from(progress.querySelectorAll(".cuboid-progress__dot"));
    const count = FACES.length;

    gsap.registerPlugin(ScrollTrigger);

    const mm = gsap.matchMedia();

    mm.add(
      {
        isDesktop: "(min-width: 1024px)",
        isTouch: "(hover: none), (pointer: coarse)",
      },
      (context) => {
        const { isTouch } = context.conditions;
        // Like the original: the whole 3D sequence is desktop-only.
        if (isTouch) return;

        // --- Page-turn mechanic -------------------------------------------------
        // Each panel fills the stage and rotates in place.
        //   outgoing panel  : hinge at TOP, rotateX 0 -> -FLIP  (lifts away upward)
        //   incoming panel  : hinge at BOTTOM, rotateX +FLIP -> 0 (rises from below)
        // So scrolling down = current page flips up while the next flips in from below.

        const SEG = count - 1; // number of transitions
        const FLIP = 90; // degrees each panel turns

        // proxy progress: 0 .. SEG (one unit per transition)
        const proxy = { p: 0 };

        const render = (p) => {
          const sClamped = Math.min(SEG - 1, Math.max(0, Math.floor(p)));
          const t = p - Math.floor(p); // 0..1 inside the segment

          faces.forEach((face, i) => {
            let rotX;
            if (i < sClamped) {
              rotX = -FLIP; // already passed: folded up, hidden
            } else if (i === sClamped) {
              rotX = -FLIP * t; // outgoing: lifting up
            } else if (i === sClamped + 1) {
              rotX = FLIP * (1 - t); // incoming: rising from below
            } else {
              rotX = FLIP; // not yet: waiting below, hidden
            }

            // hinge: panels that are lifting / already lifted hinge at TOP,
            // panels still coming / waiting hinge at BOTTOM.
            face.style.transformOrigin = i <= sClamped ? "50% 0%" : "50% 100%";
            face.style.transform = `rotateX(${rotX.toFixed(3)}deg)`;
            // the incoming panel must sit above the outgoing during the flip
            face.style.zIndex =
              i === sClamped + 1 ? "3" : i === sClamped ? "2" : "1";

            // content polish: fade/lift based on how front-facing the panel is
            const front = clamp01(1 - Math.abs(rotX) / FLIP);
            const eased = front * front * (3 - 2 * front); // smoothstep
            const inner = inners[i];
            if (inner) {
              inner.style.opacity = (0.1 + 0.9 * eased).toFixed(3);
              inner.style.transform = `translateY(${((1 - eased) * 40).toFixed(
                2
              )}px) scale(${(0.96 + 0.04 * eased).toFixed(3)})`;
            }
          });

          // theme: viewport bg + active dot follow the most front-facing panel
          const active = Math.min(count - 1, Math.round(p));
          const f = FACES[active];
          viewport.style.backgroundColor = f.accent;
          viewport.style.color =
            f.bg === "#eeece7" || f.bg === "#ff6620" ? "#0c0a0b" : "#ffffff";
          dots.forEach((d, i) => d.classList.toggle("is-active", i === active));
        };

        const tween = gsap.to(proxy, {
          p: SEG,
          ease: "none",
          scrollTrigger: {
            trigger: ".cuboid-section",
            start: "top top",
            end: `+=${SEG * 100}%`,
            pin: true,
            scrub: 1,
            anticipatePin: 1,
            snap: {
              snapTo: 1 / SEG,
              duration: { min: 0.15, max: 0.4 },
              ease: "power2.inOut",
            },
            invalidateOnRefresh: true,
          },
          onUpdate: () => render(proxy.p),
        });

        const st = tween.scrollTrigger;
        const onResize = () => {
          ScrollTrigger.refresh();
          if (st) render(st.progress * SEG);
        };
        window.addEventListener("resize", onResize);

        render(0);

        return () => {
          window.removeEventListener("resize", onResize);
        };
      }
    );
  </script>
</body>
</html>
