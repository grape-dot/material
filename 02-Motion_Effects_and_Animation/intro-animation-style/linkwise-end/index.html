<script src="https://cdn.prod.website-files.com/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdn.prod.website-files.com/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdn.prod.website-files.com/gsap/3.15.0/ScrollToPlugin.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  if (typeof gsap === "undefined") return;
  gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);
  
  const letterRotations = {
    "1": -10, "2": 7, "3": 1, "4": 6, "5": -5,
    "6": -7, "7": 6, "8": -4, "9":2, "10": -2
  };
  
  const shapes = document.querySelectorAll("[data-shape]");
  const letters = document.querySelectorAll("[letter]");
  const whiteCircle1 = document.querySelector("[data-element='white-circle-1']");
  const whiteCircle2 = document.querySelector("[data-element='white-circle-2']");
  
  const styleElement = document.createElement('style');
  styleElement.textContent = `
    .letter-wrapper {
      display: block;
      line-height: 0;
      font-size: 0;
    }
    [letter] {
      margin: 0;
      padding: 0;
      display: block;
    }
    [data-shape] {
      margin-top: 0 !important;
      padding: 0;
      display: block;
    }
  `;
  document.head.appendChild(styleElement);
  
  document.querySelectorAll(".letter-wrapper").forEach(function(wrapper) {
    const letter = wrapper.querySelector("[letter]");
    const shape = wrapper.querySelector("[data-shape]");
    
    if (letter && shape) {
      gsap.set(shape, {
        marginTop: "-50px", 
        marginBottom: "0",
        paddingTop: "0"
      });
      
      gsap.set(wrapper, {
        gap: "0",
        spacing: "0"
      });
    }
  });
  
  shapes.forEach(function(shape) {
    gsap.set(shape, {
      scale: 0,
      opacity: 0,
      height: "0px",
      clearProps: "transform"
    });
  });
  
  letters.forEach(function(letter) {
    gsap.set(letter, {
      y: 0,
      rotation: 0
    });
  });
  
  const pageLoadTimeline = gsap.timeline({ delay: 1 });
  
  pageLoadTimeline.to(shapes, {
    scale: 1,
    opacity: 1,
    height: "auto",
    duration: 0.8,
    ease: "back.out"
  }, 0);
  
  pageLoadTimeline.to(letters, {
    y: function(index) {
      const letter = letters[index];
      const letterValue = letter.getAttribute("letter");
      return letterValue === "5" ? "-=20" : "-=40";
    },
    rotation: function(index) {
      const letter = letters[index];
      const letterValue = letter.getAttribute("letter");
      return letterRotations[letterValue] || 0;
    },
    duration: 0.4,
    ease: "power2.out",
    delay: 0.1,
  }, 0).to(letters, {
    y: function(index) {
      const letter = letters[index];
      const letterValue = letter.getAttribute("letter");
      return letterValue === "5" ? "+=40" : "+=40"; 
    },
    duration: 0.5,
    ease: "bounce.out",
  }, ">");
  
  pageLoadTimeline.to([whiteCircle1, whiteCircle2], {
    y: "-=8",
    duration: 0.4,
    ease: "power2.out",
  }, "-=0.35").to([whiteCircle1, whiteCircle2], {
    y: "+=8",
    duration: 0.5,
    ease: "bounce.out"
  });
  
  ScrollTrigger.create({
    trigger: "[home-header]",
    start: "top top",
    end: "bottom 75%",
    onLeave: () => {
      gsap.to(shapes, {
        scale: 0,
        opacity: 0,
        height: "0px",
        duration: 0.8,
        ease: "back.in"
      });
      
      gsap.to(letters, {
        y: 0,
        rotation: 0,
        duration: 0.6,
        ease: "power2.in"
      });
    },
    onEnterBack: () => {
      gsap.to(shapes, {
        scale: 1,
        opacity: 1,
        height: "auto",
        duration: 0.8,
        ease: "back.out"
      });
      
      gsap.to(letters, {
        y: function(index) {
          const letter = letters[index];
          const letterValue = letter.getAttribute("letter");
          return letterValue === "5" ? "-=20" : "-=40";
        },
        rotation: function(index) {
          const letter = letters[index];
          const letterValue = letter.getAttribute("letter");
          return letterRotations[letterValue] || 0;
        },
        duration: 0.4,
        ease: "power2.out",
        delay: 0.1
      });
      
      gsap.to(letters, {
        y: function(index) {
          const letter = letters[index];
          const letterValue = letter.getAttribute("letter");
          return letterValue === "5" ? "+=40" : "+=40"; 
        },
        duration: 0.5,
        ease: "bounce.out",
        delay: 0.5
      });
    }
  });
});
</script>
